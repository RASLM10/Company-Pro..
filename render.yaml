services:
  - type: web
    name: companypro
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      - key: COMPANYPRO_ADMIN_USERNAME
        sync: false
      - key: COMPANYPRO_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: companypro-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: companypro-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: companypro-db
          property: password

databases:
  - name: companypro-db
    plan: free
    region: singapore
    databaseName: companypro
    user: companypro
