spring.application.name=companypro-api
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/companypro;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false
companypro.admin.username=${COMPANYPRO_ADMIN_USERNAME:}
companypro.admin.password=${COMPANYPRO_ADMIN_PASSWORD:}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
